
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: libraryapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d libraryapp"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # web UI: every OTP email lands here
      - "1025:1025"   # SMTP
    environment:
      MP_MAX_MESSAGES: 500

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9210:9210"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/libraryapp
      SPRING_DATA_REDIS_HOST: redis
      SPRING_MAIL_HOST: mailpit

volumes:
  postgres-data:
