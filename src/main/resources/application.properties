server.port=9210

spring.application.name=libraryapp

# ===== Datasource =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/libraryapp}
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== Connection pool (HikariCP) =====
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update

# ===== Redis =====
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=6379

# ===== JWT =====
jwt.secret=siU3RXm9eOkui3VPqps5VColRTwFf/9QeWEC3nuH+u0=
jwt.expiration-ms=3600000

# ===== Login lockout =====
security.lockout.max-attempts=5
security.lockout.window-ms=600000
security.lockout.lock-ms=1800000

# ===== Bootstrap admin =====
security.bootstrap.enabled=true
security.bootstrap.fullname=Super Admin
security.bootstrap.username=superadmin
security.bootstrap.email=superadmin@libraryapp.com
security.bootstrap.password=superadmin321

# ===== MFA / OTP =====
security.otp.length=6
security.otp.ttl-ms=300000
security.otp.max-attempts=5
security.otp.mail-from=no-reply@libraryapp.com

# ===== Audit log =====
audit.trust-forwarded-for=false

# ===== Mail (SMTP) =====
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ===== Logging =====
logging.level.root=INFO
logging.level.com.jhorgi.libraryapp=DEBUG
logging.level.org.hibernate.SQL=DEBUG
