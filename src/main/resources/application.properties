server.port=9210

spring.application.name=libraryapp


# ===== Datasource =====
spring.datasource.url=jdbc:postgresql://localhost:5432/libraryapp
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== Connection pool (HikariCP) =====
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update

# ===== Redis =====
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===== JWT =====
jwt.secret=W8j7BmHp9sBnuXVNgJfscP+qOI/e3EcsUjKdPCJ8j3I=
jwt.expiration-ms=3600000

# ===== Login lockout =====
security.lockout.max-attempts=5
security.lockout.window-ms=600000
security.lockout.lock-ms=1800000

# ===== Logging =====
logging.level.root=INFO
logging.level.com.jhorgi.libraryapp=DEBUG
logging.level.org.hibernate.SQL=DEBUG
