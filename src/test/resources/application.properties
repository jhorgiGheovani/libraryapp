# Test configuration. This file shadows src/main/resources/application.properties
# entirely: target/test-classes precedes target/classes on the classpath, so when
# tests run this is the ONLY application.properties Spring loads.
#
# That is deliberate, and it is why the values below are repeated rather than
# inherited. The guarantee is structural: a @SpringBootTest cannot reach the real
# Postgres, Redis or SMTP server even if whoever writes it forgets to opt out.
# Before this existed, `mvn test` booted the full context against the dev
# database and the bootstrap seeder created a real SUPER_ADMIN row in it.

# ===== Datasource: in-memory H2, thrown away after the run =====
spring.datasource.url=jdbc:h2:mem:libraryapp-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ===== JPA / Hibernate =====
# create-drop, not update: every run starts from an empty schema, so no test can
# depend on rows a previous run left behind.
spring.jpa.hibernate.ddl-auto=create-drop

# ===== Redis =====
# Points at a port nothing listens on. Lettuce connects lazily, so booting the
# context needs no Redis; any test that genuinely needs Redis starts its own
# embedded server on a random free port (see RedisLoginAttemptAdapterTest).
spring.data.redis.host=localhost
spring.data.redis.port=6399

# ===== Mail =====
# No spring.mail.host, so no JavaMailSender bean exists and EmailOtpSenderAdapter
# falls back to logging. Nothing can send a real email from a test.

# ===== Bootstrap admin =====
# Off: seeding is a production concern, and leaving it on would write a real
# admin row. BootstrapAdminInitializerTest drives the seeder directly instead.
security.bootstrap.enabled=false

# ===== JWT =====
# Test-only secret. Not the one the app uses, and not a secret worth protecting.
jwt.secret=dGVzdC1vbmx5LXNlY3JldC1ub3QtdXNlZC1pbi1wcm9kdWN0aW9uIQ==
jwt.expiration-ms=3600000

# ===== Login lockout =====
security.lockout.max-attempts=5
security.lockout.window-ms=600000
security.lockout.lock-ms=1800000

# ===== MFA / OTP =====
security.otp.length=6
security.otp.ttl-ms=300000
security.otp.max-attempts=5
security.otp.mail-from=no-reply@libraryapp.test

# ===== Logging =====
# Quiet: the SQL echo buries test failures in thousands of lines.
logging.level.root=WARN
logging.level.com.jhorgi.libraryapp=INFO
logging.level.org.hibernate.SQL=WARN
